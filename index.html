<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Custom Sink Configurator</title>
  </head>
  <body>
    <div id="root"></div>
    <script id="badeloft-sink-config" type="application/json">
      {
        "assetBaseUrl": "/",
        "modelBaseUrl": "/models-new",
        "productHandle": "custom-undermount-sink",
        "currency": "USD"
      }
    </script>
    <script>
      window.addEventListener("badeloft:sink:add-to-cart", function (event) {
        if (window.parent === window) return;

        window.parent.postMessage(
          {
            type: "badeloft:sink:add-to-cart",
            payload: event.detail
          },
          "https://www.badeloft.com"
        );
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
